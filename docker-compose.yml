version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: traceweaver-postgres
    environment:
      POSTGRES_USER: traceweaver
      POSTGRES_PASSWORD: traceweaver_secure_pass
      POSTGRES_DB: traceweaver_db
    ports:
      - "5432:5432"
    volumes:
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceweaver -d traceweaver_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: traceweaver-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: traceweaver-backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://traceweaver:traceweaver_secure_pass@postgres:5432/traceweaver_db
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
